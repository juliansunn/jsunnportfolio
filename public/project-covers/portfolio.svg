<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e0d17"/>
      <stop offset="100%" stop-color="#07060e"/>
    </radialGradient>
    <filter id="glow-gold">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg3)"/>
  <pattern id="dots3" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="rgba(255,204,0,0.05)"/>
  </pattern>
  <rect width="800" height="450" fill="url(#dots3)"/>

  <!-- Browser chrome mockup -->
  <rect x="120" y="60" width="560" height="310" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,204,0,0.25)" stroke-width="1.5"/>
  <!-- Title bar -->
  <rect x="120" y="60" width="560" height="28" rx="6" fill="rgba(255,204,0,0.06)" stroke="rgba(255,204,0,0.2)" stroke-width="1"/>
  <rect x="121" y="74" width="558" height="14" fill="rgba(255,204,0,0.06)"/>
  <!-- Traffic lights -->
  <circle cx="143" cy="74" r="5" fill="rgba(255,80,80,0.5)"/>
  <circle cx="159" cy="74" r="5" fill="rgba(255,185,0,0.5)"/>
  <circle cx="175" cy="74" r="5" fill="rgba(80,215,80,0.5)"/>
  <!-- URL bar -->
  <rect x="198" y="67" width="380" height="14" rx="2" fill="rgba(255,255,255,0.04)" stroke="rgba(255,204,0,0.15)" stroke-width="1"/>
  <text x="388" y="78" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" fill="rgba(255,204,0,0.4)">jsunnportfolio.vercel.app</text>

  <!-- Page content mockup inside browser -->
  <!-- Hero section skeleton -->
  <rect x="140" y="100" width="520" height="60" rx="2" fill="rgba(0,212,255,0.03)" stroke="rgba(0,212,255,0.1)" stroke-width="1"/>
  <rect x="260" y="114" width="280" height="10" rx="1" fill="rgba(0,255,159,0.15)"/>
  <rect x="310" y="130" width="180" height="6" rx="1" fill="rgba(0,212,255,0.1)"/>

  <!-- Three content blocks -->
  <rect x="140" y="172" width="156" height="90" rx="2" fill="rgba(0,255,159,0.03)" stroke="rgba(0,255,159,0.12)" stroke-width="1"/>
  <rect x="322" y="172" width="156" height="90" rx="2" fill="rgba(0,212,255,0.03)" stroke="rgba(0,212,255,0.12)" stroke-width="1"/>
  <rect x="504" y="172" width="156" height="90" rx="2" fill="rgba(183,0,255,0.03)" stroke="rgba(183,0,255,0.12)" stroke-width="1"/>

  <!-- Block labels -->
  <text x="218" y="222" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="rgba(0,255,159,0.5)">experience</text>
  <text x="400" y="222" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="rgba(0,212,255,0.5)">projects</text>
  <text x="582" y="222" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="rgba(183,0,255,0.5)">skills</text>

  <!-- Skills bar sketches in third block -->
  <rect x="520" y="196" width="60" height="4" rx="1" fill="rgba(183,0,255,0.2)"/>
  <rect x="520" y="204" width="44" height="4" rx="1" fill="rgba(183,0,255,0.15)"/>
  <rect x="520" y="212" width="52" height="4" rx="1" fill="rgba(183,0,255,0.18)"/>

  <!-- Nav dots at bottom of browser -->
  <rect x="140" y="276" width="520" height="28" rx="0" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="390" cy="290" r="3" fill="rgba(0,255,159,0.5)"/>
  <circle cx="400" cy="290" r="3" fill="rgba(255,255,255,0.15)"/>
  <circle cx="410" cy="290" r="3" fill="rgba(255,255,255,0.15)"/>

  <!-- Stack badges floating below browser -->
  <text x="220" y="340" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="rgba(0,212,255,0.5)">[ Next.js ]</text>
  <text x="310" y="340" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="rgba(0,212,255,0.5)">[ TypeScript ]</text>
  <text x="400" y="340" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="rgba(0,212,255,0.5)">[ Tailwind ]</text>
  <text x="492" y="340" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="rgba(0,212,255,0.5)">[ Sanity CMS ]</text>
  <text x="584" y="340" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="rgba(0,212,255,0.5)">[ Vercel ]</text>

  <!-- Border frame -->
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="rgba(255,204,0,0.1)" stroke-width="1"/>
  <path d="M1,20 L1,1 L20,1" fill="none" stroke="#ffcc00" stroke-width="1.5" opacity="0.5"/>
  <path d="M780,1 L799,1 L799,20" fill="none" stroke="#ffcc00" stroke-width="1.5" opacity="0.5"/>
  <path d="M1,430 L1,449 L20,449" fill="none" stroke="#ffcc00" stroke-width="1.5" opacity="0.5"/>
  <path d="M780,449 L799,449 L799,430" fill="none" stroke="#ffcc00" stroke-width="1.5" opacity="0.5"/>

  <!-- Title -->
  <text x="400" y="378" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#fff8e0" letter-spacing="3" filter="url(#glow-gold)">PORTFOLIO SITE</text>
  <text x="400" y="402" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="rgba(255,204,0,0.6)" letter-spacing="4">Next.js · Sanity CMS · Vercel · Framer Motion</text>

  <text x="16" y="20" font-family="'Courier New', monospace" font-size="9" fill="rgba(255,204,0,0.3)" letter-spacing="2">&gt; jsunnportfolio/main</text>
</svg>
