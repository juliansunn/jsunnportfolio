<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#060a0e"/>
    </radialGradient>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Dot grid -->
  <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="rgba(0,255,159,0.07)"/>
  </pattern>
  <rect width="800" height="450" fill="url(#dots)"/>

  <!-- Node graph — LLM tool connections -->
  <!-- Central LLM node -->
  <circle cx="400" cy="200" r="28" fill="none" stroke="rgba(0,255,159,0.6)" stroke-width="1.5" filter="url(#glow-green)"/>
  <circle cx="400" cy="200" r="20" fill="rgba(0,255,159,0.08)"/>
  <text x="400" y="205" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#00ff9f" font-weight="bold">LLM</text>

  <!-- Surrounding service nodes -->
  <circle cx="200" cy="130" r="18" fill="none" stroke="rgba(0,212,255,0.5)" stroke-width="1" filter="url(#glow-cyan)"/>
  <circle cx="200" cy="130" r="12" fill="rgba(0,212,255,0.06)"/>
  <text x="200" y="134" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#00d4ff">svc_a</text>

  <circle cx="600" cy="130" r="18" fill="none" stroke="rgba(0,212,255,0.5)" stroke-width="1" filter="url(#glow-cyan)"/>
  <circle cx="600" cy="130" r="12" fill="rgba(0,212,255,0.06)"/>
  <text x="600" y="134" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#00d4ff">svc_b</text>

  <circle cx="180" cy="270" r="18" fill="none" stroke="rgba(0,212,255,0.5)" stroke-width="1" filter="url(#glow-cyan)"/>
  <circle cx="180" cy="270" r="12" fill="rgba(0,212,255,0.06)"/>
  <text x="180" y="274" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#00d4ff">svc_c</text>

  <circle cx="620" cy="270" r="18" fill="none" stroke="rgba(0,212,255,0.5)" stroke-width="1" filter="url(#glow-cyan)"/>
  <circle cx="620" cy="270" r="12" fill="rgba(0,212,255,0.06)"/>
  <text x="620" y="274" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#00d4ff">svc_d</text>

  <circle cx="400" cy="310" r="18" fill="none" stroke="rgba(0,212,255,0.5)" stroke-width="1" filter="url(#glow-cyan)"/>
  <circle cx="400" cy="310" r="12" fill="rgba(0,212,255,0.06)"/>
  <text x="400" y="314" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="#00d4ff">svc_e</text>

  <!-- Connection lines -->
  <line x1="372" y1="183" x2="218" y2="143" stroke="rgba(0,255,159,0.25)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="428" y1="183" x2="582" y2="143" stroke="rgba(0,255,159,0.25)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="374" y1="215" x2="197" y2="258" stroke="rgba(0,255,159,0.25)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="426" y1="215" x2="603" y2="258" stroke="rgba(0,255,159,0.25)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="400" y1="228" x2="400" y2="292" stroke="rgba(0,255,159,0.25)" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- gRPC label on a line -->
  <text x="295" y="152" font-family="'Courier New', monospace" font-size="8" fill="rgba(0,255,159,0.4)" transform="rotate(-18, 295, 152)">gRPC</text>
  <text x="480" y="152" font-family="'Courier New', monospace" font-size="8" fill="rgba(0,255,159,0.4)" transform="rotate(18, 480, 152)">gRPC</text>

  <!-- Border frame -->
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="rgba(0,255,159,0.12)" stroke-width="1"/>
  <!-- Corner accents -->
  <path d="M1,20 L1,1 L20,1" fill="none" stroke="#00ff9f" stroke-width="1.5" opacity="0.6"/>
  <path d="M780,1 L799,1 L799,20" fill="none" stroke="#00ff9f" stroke-width="1.5" opacity="0.6"/>
  <path d="M1,430 L1,449 L20,449" fill="none" stroke="#00ff9f" stroke-width="1.5" opacity="0.6"/>
  <path d="M780,449 L799,449 L799,430" fill="none" stroke="#00ff9f" stroke-width="1.5" opacity="0.6"/>

  <!-- Title -->
  <text x="400" y="378" text-anchor="middle" font-family="'Courier New', monospace" font-size="26" font-weight="bold" fill="#e0ffe8" letter-spacing="3" filter="url(#glow-green)">LLM TOOLS SDK</text>
  <text x="400" y="403" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="rgba(0,212,255,0.6)" letter-spacing="4">Python · Go · gRPC · Model-Agnostic</text>

  <!-- Top label -->
  <text x="16" y="20" font-family="'Courier New', monospace" font-size="9" fill="rgba(0,255,159,0.35)" letter-spacing="2">&gt; virta-llm-tools/sdk</text>
</svg>
