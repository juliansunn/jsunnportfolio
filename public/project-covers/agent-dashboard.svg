<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0d1017"/>
      <stop offset="100%" stop-color="#06080e"/>
    </radialGradient>
    <filter id="glow-purple">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-c">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg2)"/>
  <pattern id="dots2" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="rgba(0,212,255,0.06)"/>
  </pattern>
  <rect width="800" height="450" fill="url(#dots2)"/>

  <!-- Orchestrator node (top) -->
  <rect x="345" y="60" width="110" height="40" rx="3" fill="rgba(183,0,255,0.08)" stroke="rgba(183,0,255,0.5)" stroke-width="1.5" filter="url(#glow-purple)"/>
  <text x="400" y="85" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="rgba(183,0,255,0.9)" font-weight="bold" letter-spacing="1">ORCHESTRATOR</text>

  <!-- Mid-tier agent nodes -->
  <rect x="150" y="160" width="100" height="36" rx="3" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.45)" stroke-width="1" filter="url(#glow-c)"/>
  <text x="200" y="182" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#00d4ff">member_agent</text>

  <rect x="350" y="160" width="100" height="36" rx="3" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.45)" stroke-width="1" filter="url(#glow-c)"/>
  <text x="400" y="182" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#00d4ff">insight_agent</text>

  <rect x="550" y="160" width="100" height="36" rx="3" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.45)" stroke-width="1" filter="url(#glow-c)"/>
  <text x="600" y="182" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#00d4ff">alert_agent</text>

  <!-- Output nodes (bottom tier) -->
  <rect x="90" y="265" width="88" height="32" rx="2" fill="rgba(0,255,159,0.04)" stroke="rgba(0,255,159,0.25)" stroke-width="1"/>
  <text x="134" y="285" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="rgba(0,255,159,0.7)">[ chart ]</text>

  <rect x="205" y="265" width="88" height="32" rx="2" fill="rgba(0,255,159,0.04)" stroke="rgba(0,255,159,0.25)" stroke-width="1"/>
  <text x="249" y="285" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="rgba(0,255,159,0.7)">[ table ]</text>

  <rect x="358" y="265" width="88" height="32" rx="2" fill="rgba(0,255,159,0.04)" stroke="rgba(0,255,159,0.25)" stroke-width="1"/>
  <text x="402" y="285" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="rgba(0,255,159,0.7)">[ widget ]</text>

  <rect x="510" y="265" width="88" height="32" rx="2" fill="rgba(0,255,159,0.04)" stroke="rgba(0,255,159,0.25)" stroke-width="1"/>
  <text x="554" y="285" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="rgba(0,255,159,0.7)">[ action ]</text>

  <rect x="620" y="265" width="88" height="32" rx="2" fill="rgba(0,255,159,0.04)" stroke="rgba(0,255,159,0.25)" stroke-width="1"/>
  <text x="664" y="285" text-anchor="middle" font-family="'Courier New', monospace" font-size="8" fill="rgba(0,255,159,0.7)">[ summary ]</text>

  <!-- Connection lines — orchestrator to agents -->
  <line x1="380" y1="100" x2="240" y2="160" stroke="rgba(183,0,255,0.3)" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="400" y1="100" x2="400" y2="160" stroke="rgba(183,0,255,0.3)" stroke-width="1" stroke-dasharray="5,3"/>
  <line x1="420" y1="100" x2="560" y2="160" stroke="rgba(183,0,255,0.3)" stroke-width="1" stroke-dasharray="5,3"/>

  <!-- Connection lines — agents to outputs -->
  <line x1="175" y1="196" x2="134" y2="265" stroke="rgba(0,212,255,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="210" y1="196" x2="249" y2="265" stroke="rgba(0,212,255,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="390" y1="196" x2="402" y2="265" stroke="rgba(0,212,255,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="570" y1="196" x2="554" y2="265" stroke="rgba(0,212,255,0.2)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="610" y1="196" x2="664" y2="265" stroke="rgba(0,212,255,0.2)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Border -->
  <rect x="1" y="1" width="798" height="448" fill="none" stroke="rgba(0,212,255,0.1)" stroke-width="1"/>
  <path d="M1,20 L1,1 L20,1" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <path d="M780,1 L799,1 L799,20" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <path d="M1,430 L1,449 L20,449" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>
  <path d="M780,449 L799,449 L799,430" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Title -->
  <text x="400" y="375" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#e0ffe8" letter-spacing="3" filter="url(#glow-c)">AGENT-FIRST DASHBOARD</text>
  <text x="400" y="400" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="rgba(183,0,255,0.7)" letter-spacing="4">Google ADK · A2A Protocol · Multi-Agent Orchestration</text>

  <text x="16" y="20" font-family="'Courier New', monospace" font-size="9" fill="rgba(0,212,255,0.3)" letter-spacing="2">&gt; spark/agent-first</text>
</svg>
